name: Atualizar GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar cache dos cards
        run: |
          sed -i "s/&v=[0-9]*/\&v=$(date +%s)/g" README.md

      - name: Commit das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git add README.md
            git commit -m "chore: atualizar GitHub stats"
            git push
          fi
